/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        imu_frame_id: vectornav_imu_link
        lidar_frame_id: vlp16_lidar_link

        safety:
            enabled: true
            max_linear_speed: 4.0
            max_angular_speed: 3.0
            max_linear_acceleration: 8.0
            max_angular_acceleration: 10.0
            max_pose_jump: 1.0
            max_vertical_speed: 0.7
            max_roll_pitch_rad: 0.7
            max_covariance_diagonal: 0.0
            max_covariance_trace: 0.0
            max_consecutive_rejects: 3
            reset_cooldown_sec: 5.0
            checkpoint_history_size: 30
            checkpoint_interval_sec: 1.0
            checkpoint_min_age_sec: 2.0
            max_checkpoint_recovery_attempts: 3
            recovery_stable_accepts: 10
            publish_raw_debug: false

        common:
            lid_topic:  "vlp16/points"
            imu_topic:  "vectornav/imu"
            get_sensor_frames_from_msgs: true # Resolve IMU and LiDAR frames once from the input message headers
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
            scan_line: 32
            scan_rate: 10                # only need to be set for velodyne, unit: Hz,
            timestamp_unit: 2            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            blind: 2.0

        mapping:
            get_extrinsic_from_tf: true # Look up the static IMU<-LiDAR transform once before processing
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
            extrinsic_T: [ -0.328, -0.050, 0.478]
            extrinsic_R: [ 0., -1., 0., 
                        1., 0., 0., 
                        0., 0., 1.]

        publish:
            path_en:  false
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
